name: Make container a thing.

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.github/workflows/**.yaml'
      - 'Socket-Activation/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and push to ghcr
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: ghcr.io/amitie10g/binfmt:latest
          platforms: arm64
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=ghcr.io/amitie10g/buildkit:master

      - name: SHA256 commit (short)
        id: commit
        uses: prompt/actions-commit-hash@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Caddy image with third-party modules
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          build-args: |
            CADDY_MODULES=github.com/mholt/caddy-ratelimit github.com/WeidiDeng/caddy-cloudflare-ip github.com/fvbommel/caddy-combine-ip-ranges github.com/caddy-dns/cloudflare github.com/hslatman/caddy-crowdsec-bouncer/http github.com/hslatman/caddy-crowdsec-bouncer/appsec github.com/hslatman/caddy-crowdsec-bouncer/layer4 github.com/mholt/caddy-l4/layer4 github.com/davidscarth/caddy-geoip
            CADDY_VERSION=v2.11.4
          pull: true
          push: true
          file: Containerfile
          tags: |
            ghcr.io/rubberverse/qor-caddy:latest
            ghcr.io/rubberverse/qor-caddy:${{ steps.commit.outputs.short }}

      - name: Build and push vanilla Caddy image without third-party modules
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          build-args: |
            CADDY_VERSION=v2.11.4
          pull: true
          push: true
          file: Containerfile
          tags: |
            ghcr.io/rubberverse/qor-caddy:latest-vanilla
            ghcr.io/rubberverse/qor-caddy:vanilla-${{ steps.commit.outputs.short }}
